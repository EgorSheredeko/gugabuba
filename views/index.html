<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новые товарищи</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Шрифт в советском стиле (угловатый/плакатный) -->
    <link href="https://fonts.googleapis.com/css2?family=Stalinist+One&family=Roboto:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="soviet-header">
        <h1>ВНИМАНИЕ! ТООВАРИЩИ!</h1>
        <div class="slogan">«ТРУД, КОЛЛЕКТИВ И ПЕРСОНАЛЬНЫЙ ЧАТ НА БЛАГО ОТЕЧЕСТВА!»</div>
    </header>

    <main class="content">
        <h2 class="main-title">ЧЕ ВЫЛУПИЛИСЬ?</h2>
        
        <div class="friends-grid">
            <!-- ДРУГ 1 -->
            <div class="friend-card">
                <div class="photo-frame">
                    <img src="/RAimage.png" alt="Товарищ 1">
                </div>
                <div class="friend-name">ТОВ. РАТМИР</div>
                <div class="friend-desc">РАТАТУЙ</div>
            </div>

            <!-- ДРУГ 2 -->
            <div class="friend-card">
                <div class="photo-frame">
                    <img src="/Rimage.png" alt="Товарищ 2">
                </div>
                <div class="friend-name">ТОВ. РУСЛАН</div>
                <div class="friend-desc">ТЕЛЕФОН</div>
            </div>

            <!-- ДРУГ 3 -->
            <div class="friend-card">
                <div class="photo-frame">
                    <img src="/Mimage.png" alt="Товарищ 3">
                </div>
                <div class="friend-name">ТОВ. МАДИ</div>
                <div class="friend-desc">ПРОГРАММИСТ</div>
            </div>

            <!-- ДРУГ 4: АСЕТ -->
            <div class="friend-card">
                <div class="photo-frame">
                    <!-- Замени aset.png на имя своего файла в папке public -->
                    <img src="/Aset.jpeg" alt="Товарищ 4">
                </div>
                <div class="friend-name">ТОВ. АСЕТ</div>
                <div class="friend-desc">ПАНДА</div>
            </div>

            <!-- ДРУГ 5: АРТЕМ -->
            <div class="friend-card">
                <div class="photo-frame">
                    <!-- Замени artem.png на имя своего файла в папке public -->
                    <img src="/ART.png" alt="Товарищ 5">
                </div>
                <div class="friend-name">ТОВ. АРТЕМ</div>
                <div class="friend-desc">СЛЕНДЕРМЕН</div>
            </div>
        </div>
    </main>

    <footer class="soviet-footer">
        <p>ПАРТИЯ ГОРДИТСЯ ВАМИ! (но это не точно)</p>
    </footer>

</body>
</html>
